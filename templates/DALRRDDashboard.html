<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriTrial | DALRRD Review</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(180deg, #bfe3f5 0%, #fff0b8 45%, #F2C200 100%); margin: 0; color: #02570c; }
        .header { background: #154b3c; color: white; padding: 20px; }
        main { max-width: 1100px; margin: 24px auto; padding: 0 20px; }
        button { margin: 10px; padding: 10px 20px; border: none; background: #154b3c; color: white; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>AgriTrial Dashboard <span class="sub-tag">| DALRRD Review Platform</span></h1>
        <div>
            <span style="font-size: 0.9rem; margin-right: 1rem;">Active Trial: <strong>Canola-25</strong></span>
        </div>
    </header>

<main>

    <div class="card">
        <h2>Trial Sites</h2>

        <table>
            <thead>
                <tr>
                    <th>Farmer</th>
                    <th>Farm</th>
                    <th>Site</th>
                    <th>Soil Type</th>
                    <th>Verification</th>
                    <th>Queries</th>
                </tr>
            </thead>

            <tbody>
                {% for site in sites %}
                <tr>
                    <td>{{ site.farmer_name }}</td>
                    <td>{{ site.farm_name }}</td>
                    <td>{{ site.site_name }}</td>
                    <td>{{ site.soil_type }}</td>

                    <td>
                        <form method="post"
                              action="{{ url_for('verify_trial', trial_id=site.trial_id) }}">
                            <button type="submit" class="btn btn-verify">
                                Verify Trial
                            </button>
                        </form>
                    </td>

                    <td>
                        <form method="post"
                              action="{{ url_for('query_trial', trial_id=site.trial_id) }}">
                            <textarea
                                name="message"
                                placeholder="Enter verification comments or required checks..."
                                required></textarea>

                            <button type="submit" class="btn btn-query">
                                Submit Query
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div class="actions">

            <form method="get"
                  action="{{ url_for('download_dalrrd_report') }}">
                <button type="submit" class="btn btn-report">
                    Download PDF Report
                </button>
            </form>

            <a href="{{ url_for('login') }}">
                <button class="btn-logout">Logout</button>
            </a>

        </div>
    </div>

</main>
</body>
</html>
